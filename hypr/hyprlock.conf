$font = JetBrains Mono 

general{
	disable_loading_bar = false
	hide_cursor = true
	grace = 1
	ignore_empty_input = true
	no_fade_in = false
}

background{
	monitor = 
	path = /home/bruno/Downloads/GeYZzh0WcAAM8Yo.png
	blur_passes = 1
	blur_size = 3
}


animations {
	enable = true
	bezier = linear 1, 1, 0, 0
	animation = fadeIn 1, 8, linear
	animation = fadeOut 1, 8, linear
	animation = inputFieldDots, 1, 5, linear
}

# HOUR
label {

    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgba(204, 102, 0, 0.8)

    font_size = 160
    font_family = $font ExtraBold

    position = 0, 100
    halign = center
    valign = center
}

# MINUTES
label {

    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(255, 153, 53, 0.8)

    font_size = 160
    font_family = $font ExtraBold

    position = 0, -100
    halign = center
    valign = center
}

# DATE
label {

    monitor =
    text = cmd[update:60000]  date +"%A, %d %B %Y"
    color = rgba(206, 102, 0, 0.8)

    font_size = 20
    font_family = $font Italic Bold

    position = 0, 300
    halign = center
    valign = bottom
}



image {
    monitor =
    path = /home/bruno/Downloads/sua-imagem-circular.png
    rounding = 999
    border = 0
    border_color = rgba(0,0,0,0.0)
    position = 0, -150
    halign = center
    valign = top
}


#USER
label {
    monitor =
    text = cmd[] echo -e "  Hello, $USER!$( [ \"$ATTEMPTS\" != \"0\" ] && echo " ($ATTEMPTS)")"
    color = rgba(204, 102, 0, 1.0)
    
    font_size = 20
    
    font_family = $font Italic Bold 

    position = 0, 150
    halign = center
    valign = bottom
}

input-field {
	monitor = 
	size = 20%, 5%
	outline_thickness = 3
	inner_color = rgba(0,0,0,0.0)
	
	outer_color = rgba(8B4516E6) rgba(A0522DE6) 45deg
	check_color = rgba(A0522DE6) rgba(8B4516E6) 120deg
	fail_color = rgba(A0522DE6) rgba(8B4516E6) 40deg

	font_color = rgba(203, 102, 0, 0.8)
	fade_on_empty = false
	rounding = 15
	
	dots_size = 0.4
	dots_spacing = 0.3

	font_family = $font italic
	placeholder_text = input password
	
	halign = center
	valign = bottom
	position = 0, 30
}


