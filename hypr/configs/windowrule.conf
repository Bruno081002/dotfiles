# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
windowrule = opacity 0.80 0.40,match:class ^(.*)$

windowrule = size 1000 1000,float on ,match:title ^(Open)$
windowrule = size 1000 1000,float on ,match:title ^(Choose Files)$
windowrule = size 1000 1000,float on ,match:title ^(Save As)$
windowrule = size 1000 1000,float on ,match:title ^(Confirm to replace files)$
windowrule = size 1000 1000,float on ,match:title ^(File Operation Progress)$
windowrule = size 1000 1000,float on ,match:class ^(xdg-desktop-portal-gtk)$

