#

# Resize windows using $mod+ALT and k, j, h, l
bind = $mod+ALT+CONTROL, h, resizeactive, -10 0
bind = $mod+ALT+CONTROL, j, resizeactive, 0 10
bind = $mod+ALT+CONTROL, k, resizeactive, 0 -10
bind = $mod+ALT+CONTROL, l, resizeactive, 10 0
# movewindow using $mod+ALT+SHIFT
binde = $mod+ALT+SHIFT, j , moveactive, 0 -20
binde = $mod+ALT+SHIFT, k,  moveactive, 0 20
binde = $mod+ALT+SHIFT, l, moveactive, -20 0
binde = $mod+ALT+SHIFT, h, moveactive, 20 0


